name: Manual Deploy to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: main

permissions:
  contents: read

jobs:
  deploy:
    name: Manual Deploy to Cloudflare
    runs-on: ubuntu-latest
    if: github.repository == 'KotonoSora/nara-vite-react-boilerplate'
    environment: ${{ github.event.inputs.branch == 'main' && 'production' || 'development' }}

    steps:
      - name: Validate required secrets and variables
        run: |
          missing_secrets=()
          missing_vars=()

          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing_secrets+=("CLOUDFLARE_API_TOKEN")
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing_secrets+=("CLOUDFLARE_ACCOUNT_ID")
          [ -z "${{ secrets.D1_DATABASE_ID }}" ] && missing_secrets+=("D1_DATABASE_ID")
          [ -z "${{ secrets.D1_DATABASE_NAME }}" ] && missing_secrets+=("D1_DATABASE_NAME")

          if [ "${{ github.event.inputs.branch }}" != "main" ]; then
            [ -z "${{ secrets.BASIC_AUTH_USERNAME }}" ] && missing_secrets+=("BASIC_AUTH_USERNAME")
            [ -z "${{ secrets.BASIC_AUTH_PASSWORD }}" ] && missing_secrets+=("BASIC_AUTH_PASSWORD")
            [ -z "${{ vars.VITE_DEV_DOMAIN }}" ] && missing_vars+=("VITE_DEV_DOMAIN")
          else
            [ -z "${{ vars.VITE_PROD_DOMAIN }}" ] && missing_vars+=("VITE_PROD_DOMAIN")
          fi

          if [ ${#missing_secrets[@]} -ne 0 ]; then
            echo "❌ Missing secrets: ${missing_secrets[*]}"
            exit 1
          fi

          if [ ${#missing_vars[@]} -ne 0 ]; then
            echo "❌ Missing variables: ${missing_vars[*]}"
            exit 1
          fi

      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Disable wrangler telemetry
        run: bun wrangler telemetry disable

      - name: Generate Wrangler types
        run: bun run wrangler types

      - name: Run Drizzle migrations
        run: bun run db:migrate-production

      - name: Build and deploy to Cloudflare Workers
        run: |
          bun run build
          bun run deploy -- --env="$CLOUDFLARE_ENV"

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      CLOUDFLARE_ENV: ${{ github.event.inputs.branch == 'main' && 'production' || 'development' }}
      NODE_ENV: production
      ADMIN_REGISTRATION_SECRET: ${{ secrets.ADMIN_REGISTRATION_SECRET }}
      VITE_DOMAIN_ENV: ${{ github.event.inputs.branch == 'main' && 'production' || 'development' }}
      VITE_MAX_USERS: ${{ vars.VITE_MAX_USERS }}
      VITE_LANDING_PAGE_TITLE: ${{ vars.VITE_LANDING_PAGE_TITLE }}
      VITE_LANDING_PAGE_DESCRIPTION: ${{ vars.VITE_LANDING_PAGE_DESCRIPTION }}
      VITE_LANDING_PAGE_REPOSITORY: ${{ vars.VITE_LANDING_PAGE_REPOSITORY }}
      VITE_LANDING_PAGE_COMMERCIAL_LINK: ${{ vars.VITE_LANDING_PAGE_COMMERCIAL_LINK }}
      VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
      VITE_GOOGLE_ANALYTIC_TRACKING_ID: ${{ vars.VITE_GOOGLE_ANALYTIC_TRACKING_ID }}
      VITE_DONATE_LINK: ${{ vars.VITE_DONATE_LINK }}
      CLOUDFLARE_PROD_DOMAIN: ${{ vars.VITE_PROD_DOMAIN }}
      CLOUDFLARE_DEV_DOMAIN: ${{ vars.VITE_DEV_DOMAIN }}
      VITE_PROD_DOMAIN: https://${{ vars.VITE_PROD_DOMAIN }}
      VITE_DEV_DOMAIN: https://${{ vars.VITE_DEV_DOMAIN }}
      BASIC_AUTH_USERNAME: ${{ secrets.BASIC_AUTH_USERNAME }}
      BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
